name: Bug
description: Something is broken
title: "BUG: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened vs what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce / logs
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment (dev or prod)
